<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cuenta de ahorro</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f1f5f9;
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .tarjeta {
            background-color: white;
            width: 350px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h1 {
            margin-top: 0;
            text-align: center;
        }

        .saldo {
            background-color: #e0f2fe;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 25px;
        }

        .saldo label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .saldo-valor {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            font-size: 16px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
        }

        .moneda {
            font-weight: bold;
        }

        .saldo-numero {
            font-weight: bold;
        }

        .ingreso {
            margin-bottom: 20px;
        }

        .ingreso label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background-color: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #1d4ed8;
        }

        #mensaje {
            text-align: center;
            margin-top: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="tarjeta">

        <h1>💰 Mi cuenta de ahorro</h1>

        <div class="saldo">
            <div class="saldo-valor">
                <span>Saldo actual: </span>
                <span id="saldo" class="saldo-numero"></span>
                <span class="moneda">€</span>
            </div>
        </div>

        <div class="ingreso">
            <label for="ingreso">Cantidad a ingresar</label>
            <input id="ingreso" type="number" placeholder="Ej: 100">
        </div>

        <button id="ingresar">Ingresar dinero</button>

        <p id="mensaje"></p>

    </div>

    <script>

        // Estado de la aplicación
        let saldo = 500;

        const saldoTexto = document.querySelector("#saldo");
        const ingresoInput = document.querySelector("#ingreso");
        const boton = document.querySelector("#ingresar");
        const mensaje = document.querySelector("#mensaje");

        // Inicializamos el saldo inicial en la interfaz del usuario con el valor de la variable de estado
        saldoTexto.textContent = saldo;

        boton.addEventListener("click", function () {

            // sumamos lo que quiere ingresar el usuario al saldo actual
            saldo = saldo + ingresoInput.value;

            // Actualizamos la interfaz del usuario con el nuevo saldo
            saldoTexto.textContent = saldo;

            // Mensaje de confirmación en la interfaz de usuario
            mensaje.textContent = "Dinero ingresado correctamente.";

        });

    </script>

</body>
</html>
