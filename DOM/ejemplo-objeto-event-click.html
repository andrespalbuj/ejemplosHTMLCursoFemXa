<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Coordenadas</title>

    <style>
        body {
            margin: 0;
        }

        #caja {
            width: 100vw;
            height: 100vh;
            cursor: crosshair;
            border: 5px solid red;
        }
    </style>
</head>

<body>

    <main id="caja"></main>

    <script>

        

        const caja = document.querySelector("#caja");
        caja.addEventListener("click", function(event) {
           console.log("Coordenada X del click: ", event.clientX);
           console.log("Coordenada Y del click: ", event.clientY);
        });
         
    

    </script>

</body>

</html>
