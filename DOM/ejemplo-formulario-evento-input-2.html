<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Control de volumen</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f1f5f9;

            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .tarjeta {
            width: 400px;
            padding: 30px;
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            text-align: center;
        }

        h1 {
            margin-top: 0;
        }

        #volumen {
            width: 100%;
            margin: 30px 0;
        }

        #valor {
            font-size: 32px;
            font-weight: bold;
            color: #2563eb;
        }
    </style>
</head>

<body>

    <div class="tarjeta">

        <h1>🔊 Volumen</h1>

        <input
            id="volumen"
            type="range"
            min="0"
            max="100"
            value="50"
        >

        <div id="valor">50 %</div>

    </div>

    <script>

        const volumen = document.querySelector("#volumen");
        const valor = document.querySelector("#valor");

        volumen.addEventListener("input", function () {

            valor.textContent = volumen.value + " %";

        });

    </script>

</body>

</html>
